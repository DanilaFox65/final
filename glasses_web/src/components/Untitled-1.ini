import { Glasses } from '../types/types';
import { Link } from 'react-router-dom';
import { addServiceToDraft } from '../api/orderService';  // Импортируем функцию

interface GlassesCardProps {
    service: Glasses;
    onDelete: (id: number) => void;
    user: any; // Добавляем пропс для пользователя
    token: string | null; // Добавляем пропс для токена
}

export const GlassesCard = ({ service, user, token, onDelete }: GlassesCardProps) => {

    const handleAddToDraft = () => {
        if (token) {
            addServiceToDraft(service.id, token) // Передаем id услуги и токен
                .then(response => {
                    console.log('Услуга добавлена в черновик:', response);
                })
                .catch(error => {
                    console.error('Ошибка при добавлении в черновик:', error);
                });
        } else {
            console.log('Пользователь не авторизован. Необходим токен.');
        }
    };

    // Убедимся, что user и token существуют
    const isUserAuthorized = user && token;

    return (
        <div className="glasses-card">
            <img src={service.image} alt={service.name} />
            <h2>{service.name}</h2>
            <p>Цена: {service.price} руб.</p>

            <div className="card-actions">
                <Link to={`/detail/${service.id}`} className="btn-detail">
                    Подробнее
                </Link>

                {/* Показываем кнопку "Добавить в черновик", только если user и token существуют */}
                {isUserAuthorized && (
                    <button
                        className="btn-add-to-draft"
                        onClick={handleAddToDraft} // Вызываем обработчик при клике
                    >
                        Добавить в черновик
                    </button>
                )}
            </div>
        </div>
    );
};
